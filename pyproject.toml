[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwresearch"
version = "0.1.0"
description = "SEO opportunity finder: DataForSEO data + LLM judgment -> prioritized page actions"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "openai>=1.40",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
kwresearch = "kwresearch.cli:main"

[tool.setuptools.packages.find]
include = ["kwresearch*"]

[tool.setuptools.package-data]
kwresearch = ["report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
